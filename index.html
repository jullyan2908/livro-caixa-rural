<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Livro Caixa Rural</title>

    <!-- PWA -->
    <meta name="theme-color" content="#0B6E4F">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Livro Caixa">

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="icon" type="image/png" href="icons/icon-192.png">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app-root"></div>

<!-- Firebase (cópia local: o app abre mesmo sem sinal) -->
<script src="vendor/firebase/firebase-app-compat.js"></script>
<script src="vendor/firebase/firebase-auth-compat.js"></script>
<script src="vendor/firebase/firebase-firestore-compat.js"></script>

<!-- O app (Excel, PDF e ZIP são carregados só quando precisa) -->
<script src="js/util.js"></script>
<script src="js/dados.js"></script>
<script src="js/nota-pdf.js"></script>
<script src="js/lancamentos.js"></script>
<script src="js/painel.js"></script>
<script src="js/declaracao.js"></script>
<script src="js/exportar.js"></script>
<script src="app.js"></script>

<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js');
    });
}
</script>

</body>
</html>
